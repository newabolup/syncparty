version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncparty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncparty
      POSTGRES_PASSWORD: syncparty_secure_password_123
      POSTGRES_DB: syncparty_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncparty -d syncparty_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  syncparty:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncparty_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://syncparty:syncparty_secure_password_123@postgres:5432/syncparty_db?schema=public
      CORS_ORIGIN: http://localhost:5000,http://localhost:5173
      JWT_SECRET: syncparty_prod_secret_replace_in_production_key_492
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
